---
- name: configure tomcat
  hosts: all
  tasks: 
   - name: Install tomcat10
     apt:
       name: tomcat10
       state: present
       update_cache: yes
   - name: Install tomcat10-admin
     apt:
       name: tomcat10-admin
       state: present
   - name: Copy customized tomcat-users.xml file
     copy:
       src: tomcat-users.xml
       dest: /etc/tomcat10
   - name: change port of tocat from 9090 to 8080
     replace:
        regexp: 8080
        replace: 9090
        path: /etc/tomcat10/server.xml
   - name: restart the service
     service: 
        name: tomcat10
        state: restarted
   - name: pause for 50 seconds
     pause:
        seconds: 50     
   - name: check if tomcat is working on port 8080 for server1
     uri:
       url: http://13.232.213.195:9090
       status_code: 200
   - name: check if tomcat is working on port 8080 for server2
     uri:
       url: http://52.66.253.229:9090
       status_code: 200
...
